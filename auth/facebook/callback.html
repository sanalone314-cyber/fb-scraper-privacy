<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login Callback</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      background:#eef3ff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .card{
      background:#fff;
      padding:30px;
      border-radius:15px;
      width:360px;
      text-align:center;
      box-shadow:0 8px 25px rgba(0,0,0,.15);
    }
    h2{color:#1877F2;}
    #status{margin-top:20px;font-size:16px;word-break:break-word;}
  </style>
</head>
<body>
<div class="card">
  <h2>FB SCRAPER</h2>
  <p>Completing Facebook Login...</p>
  <div id="status">Waiting for Facebook response...</div>
</div>

<script>
const hash = window.location.hash.substring(1);
const params = new URLSearchParams(hash);

const accessToken = params.get("access_token");
const error = params.get("error");

if (error) {
    alert("Facebook Login Failed: " + error);
} else if (accessToken) {

    // Token Save
    localStorage.setItem("fb_access_token", accessToken);

    alert("Facebook Login Successful!");

    // Main Page पर वापस जाओ
    window.location.href =
      "https://sanalone314-cyber.github.io/fb-scraper-privacy/";
} else {
    alert("Access Token Not Found");
}
</script>

</body>
</html>
