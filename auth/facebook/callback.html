<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Facebook Login Callback - FB SCRAPER</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f0f4ff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:#fff;
      width:420px;
      padding:35px;
      border-radius:16px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.12);
    }

    .logo{
      width:80px;
      height:80px;
      border-radius:50%;
      background:#1877F2;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      margin:auto;
      font-size:36px;
      font-weight:bold;
    }

    h2{
      margin-top:18px;
      color:#1877F2;
    }

    p{
      color:#555;
      margin:15px 0;
      line-height:1.6;
    }

    .status{
      margin-top:20px;
      padding:12px;
      border-radius:8px;
      background:#EEF5FF;
      color:#1877F2;
      font-weight:bold;
      word-break:break-word;
    }

    .success{
      background:#EAFBF0;
      color:#178344;
    }

    .error{
      background:#FFECEC;
      color:#C62828;
    }

    .spinner{
      margin:20px auto;
      width:40px;
      height:40px;
      border:4px solid #ddd;
      border-top:4px solid #1877F2;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      to{transform:rotate(360deg);}
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">f</div>

  <h2>FB SCRAPER</h2>

  <p>Completing Facebook Login...</p>

  <div class="spinner"></div>

  <div id="status" class="status">
    Waiting for Facebook response...
  </div>

</div>

<script>
const statusBox = document.getElementById("status");

const hash = window.location.hash.substring(1);
const params = new URLSearchParams(hash);

const accessToken = params.get("access_token");
const expiresIn = params.get("expires_in");

if(accessToken){

    statusBox.classList.add("success");
    statusBox.innerHTML =
      "✅ Facebook Login Successful.<br><br>Access Token received.";

    localStorage.setItem("FB_ACCESS_TOKEN", accessToken);
    localStorage.setItem("FB_TOKEN_EXPIRES", expiresIn || "");

    setTimeout(()=>{
      window.location.href = "../../index.html";
    },2000);

}else{

    const query = new URLSearchParams(window.location.search);
    const error = query.get("error_description") || query.get("error");

    statusBox.classList.add("error");
    statusBox.innerHTML =
      "❌ Facebook Login Failed.<br><br>" +
      (error || "Access token not found.");
}
</script>

</body>
</html>
