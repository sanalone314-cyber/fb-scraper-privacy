
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB SCRAPER v2.0 Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#1877F2,#0B3D91);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{width:100%;max-width:760px;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:24px;padding:30px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.logo{width:100px;display:block;margin:0 auto 15px}
h1{text-align:center;font-size:36px}
p{text-align:center;color:#eaf2ff;margin:10px 0 20px}
.fb-btn{width:100%;padding:15px;border:none;border-radius:12px;background:#1877F2;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
.fb-btn:hover{background:#0B5ED7}
.card{background:#fff;color:#111827;border-radius:18px;padding:18px;margin-top:20px}
.status{padding:10px;border-radius:10px;font-weight:bold;text-align:center;margin-bottom:10px}
.disconnected{background:#FEE2E2;color:#B91C1C}
.connected{background:#DCFCE7;color:#15803D}
textarea{width:100%;height:120px;padding:12px;border:2px solid #2563EB;border-radius:10px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1;padding:10px;border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer}
.save{background:#16A34A}.copy{background:#2563EB}.clear{background:#DC2626}
#dashboard{display:none;margin-top:20px}
.profile{text-align:center}
.profile img{width:120px;height:120px;border-radius:50%;border:4px solid #1877F2}
.list{background:rgba(255,255,255,.08);padding:12px;border-radius:12px;margin-top:15px}
.list li{margin:8px 0}
footer{text-align:center;margin-top:25px;color:#dbeafe}
footer a{color:white;text-decoration:none;margin:0 8px}
</style>
</head>
<body>

<div class="container">

<img src="assets/logo.png" class="logo" alt="FB SCRAPER Logo">

<h1>FB SCRAPER v2.0</h1>
<p>Facebook Analytics Dashboard • Meta Graph API • GitHub Pages Ready</p>

<button class="fb-btn" onclick="loginWithFacebook()">🔵 Login with Facebook</button>

<div class="card">
<h3>🟢 Facebook Access Token Manager</h3>

<div id="connectionStatus" class="status disconnected">🔴 Not Connected</div>

<label><b>Facebook Access Token</b></label>

<textarea id="fbToken" placeholder="Paste EAAGxxxxxxxxxxxxxxxx Access Token here"></textarea>

<div class="actions">
<button class="save" onclick="saveToken()">💾 Save Token</button>
<button class="copy" onclick="copyToken()">📋 Copy</button>
<button class="clear" onclick="clearToken()">🗑 Clear</button>
</div>

<p id="tokenMessage"></p>
</div>

<div id="dashboard">

<div class="card profile">
<img id="userPic" src="assets/user.png">
<h2 id="userName">Facebook User</h2>
<p id="userEmail">Email will appear here</p>

<button onclick="logoutFacebook()" class="clear" style="padding:12px 25px;margin-top:10px;border:none;border-radius:10px;color:#fff">Logout</button>
</div>

<div class="card">
<h3>📊 Dashboard</h3>

<ul id="postList" class="list"></ul>
</div>

</div>

<footer>
<a href="privacy-policy.html">Privacy Policy</a> |
<a href="terms.html">Terms</a> |
<a href="data-deletion.html">Data Deletion</a>

<br><br>

© 2026 FB SCRAPER v2.0 Premium
</footer>

</div>

<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>

<script>

window.fbAsyncInit=function(){

FB.init({
appId:"2328948191213332",
cookie:true,
xfbml:true,
version:"v23.0"
});

FB.getLoginStatus(function(response){

if(response.status==="connected"){
saveAccessToken(response.authResponse.accessToken);
}

});

};

function loginWithFacebook(){

FB.login(function(response){

if(response.authResponse){

saveAccessToken(response.authResponse.accessToken);

}else{
alert("Facebook Login Cancelled");
}

},{scope:"public_profile,email"});

}

function saveAccessToken(token){

localStorage.setItem("fb_access_token",token);

document.getElementById("fbToken").value=token;

setConnected(true);

fetchUserProfile();

}

function saveToken(){

const token=document.getElementById("fbToken").value.trim();

if(!token){
alert("Access Token Paste Karo");
return;
}

saveAccessToken(token);

document.getElementById("tokenMessage").innerText="✅ Token Saved Successfully";

}

function copyToken(){

const box=document.getElementById("fbToken");

box.select();

document.execCommand("copy");

document.getElementById("tokenMessage").innerText="📋 Token Copied";

}

function clearToken(){

localStorage.removeItem("fb_access_token");

document.getElementById("fbToken").value="";

setConnected(false);

document.getElementById("dashboard").style.display="none";

document.getElementById("tokenMessage").innerText="🗑 Token Removed";

}

function logoutFacebook(){

localStorage.removeItem("fb_access_token");

location.reload();

}

function setConnected(state){

const status=document.getElementById("connectionStatus");

if(state){
status.className="status connected";
status.innerHTML="🟢 Connected to Facebook";
}else{
status.className="status disconnected";
status.innerHTML="🔴 Not Connected";
}

}

async function fetchUserProfile(){

const token=localStorage.getItem("fb_access_token");

if(!token) return;

try{

const res=await fetch(`https://graph.facebook.com/me?fields=id,name,email,picture.width(200).height(200)&access_token=${token}`);

const user=await res.json();

if(user.error){
setConnected(false);
return;
}

document.getElementById("dashboard").style.display="block";

document.getElementById("userName").innerText=user.name;
document.getElementById("userEmail").innerText=user.email || "No Email";
document.getElementById("userPic").src=user.picture.data.url;

loadPosts();

}catch(e){
console.log(e);
}

}

async function loadPosts(){

const token=localStorage.getItem("fb_access_token");

try{

const res=await fetch(`https://graph.facebook.com/me/posts?fields=message,created_time&limit=5&access_token=${token}`);

const posts=await res.json();

const list=document.getElementById("postList");

list.innerHTML="";

(posts.data || []).forEach(post=>{

const li=document.createElement("li");

li.innerHTML=`<b>${post.created_time.substring(0,10)}</b><br>${post.message || "No Text Post"}`;

list.appendChild(li);

});

}catch(err){
console.log(err);
}

}

window.onload=function(){

const token=localStorage.getItem("fb_access_token");

if(token){

document.getElementById("fbToken").value=token;

setConnected(true);

fetchUserProfile();

}

};

</script>

</body>
</html>
