<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login Callback</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      background:#eef3ff;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .card{
      background:#fff;
      padding:30px;
      border-radius:15px;
      width:360px;
      text-align:center;
      box-shadow:0 8px 25px rgba(0,0,0,.15);
    }
    h2{color:#1877F2;}
    #status{margin-top:20px;font-size:16px;word-break:break-word;}
  </style>
</head>
<body>
<div class="card">
  <h2>FB SCRAPER</h2>
  <p>Completing Facebook Login...</p>
  <div id="status">Waiting for Facebook response...</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get("code");
const error = params.get("error");
const status = document.getElementById("status");

if(error){
    status.innerHTML = "❌ Facebook Login Failed:<br>" + error;
}
else if(code){
    status.innerHTML = "✅ Login Successful!<br><br>Authorization Code Received.<br><br><small>Saving...</small>";

    localStorage.setItem("fb_auth_code", code);

    setTimeout(()=>{
        window.location.href = "https://sanalone314-cyber.github.io/fb-scraper-privacy/";
    },2000);
}
else{
    status.innerHTML = "❌ No authorization code received.";
}
</script>

</body>
</html>
