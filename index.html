<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB SCRAPER v1.0 Premium</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
}
.header{
    background:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.container{
    max-width:900px;
    margin:25px auto;
    padding:20px;
}
.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}
button{
    background:#1877F2;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}
button:hover{
    background:#145bd1;
}
.profile{
    display:flex;
    align-items:center;
    gap:15px;
}
.profile img{
    width:70px;
    height:70px;
    border-radius:50%;
}
input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ddd;
}
ul{
    padding-left:18px;
}
li{
    margin-bottom:12px;
}
</style>
</head>

<body>

<div class="header">
<h2>📘 FB SCRAPER v2.0 Premium</h2>
<button onclick="logoutFacebook()">Logout</button>
</div>

<div class="container">

<div class="card">
<h3>Facebook Login</h3>

<button onclick="loginWithFacebook()">
Login with Facebook
</button>

<p id="loginStatus">🔴 Not Connected</p>

<input id="accessToken" placeholder="Facebook Access Token" readonly>
</div>

<div class="card">
<h3>User Profile</h3>

<div class="profile">
<img id="userPhoto" src="assets/default-avatar.png">
<div>
<h2 id="userName">Guest User</h2>
<p id="userEmail">No Email</p>
</div>
</div>
</div>

<div class="card">
<h3>Last 5 Facebook Posts</h3>

<ul id="postList">
<li>Loading...</li>
</ul>

<button onclick="loadPosts()">Refresh Posts</button>

</div>

</div>

<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
